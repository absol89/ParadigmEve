name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS arm64
            runner: macos-15
          - name: Linux x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify:ci

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install plugin Python runtime
        run: python -m pip install uv==0.12.5

      - name: Exercise published plugins on this OS
        env:
          COS_PLUGIN_LIVE_TEST: '1'
        run: npx vitest run test/plugins-live-proxy.test.ts test/plugins-python-live.test.ts test/plugins-catalog-live.test.ts

  locale:
    name: Verify Linux x64 (sv_SE locale)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANG: sv_SE.UTF-8
      LC_ALL: sv_SE.UTF-8

    steps:
      - name: Generate the Swedish locale
        run: sudo locale-gen sv_SE.UTF-8 && sudo update-locale

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm the locale reaches Node
        run: node -e "const l=Intl.DateTimeFormat().resolvedOptions().locale; console.log(l); if(!l.startsWith('sv')) process.exit(1)"

      - name: Test
        run: npm run rg && npx vitest run --exclude test/mcp-shutdown.test.ts --exclude test/computer.test.ts
