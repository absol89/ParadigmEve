name: Publish release

# Dispatch this at the tag you want released:
#   gh workflow run publish.yml --ref v2.0.2
#
# Every release is created as a pre-release. Promoting one to Latest is a manual step on GitHub,
# and it is what the in-app updater follows (see src/main/update.ts).
#
# It builds the candidate itself rather than adopting one from an earlier run, so the
# installers attached to a release are provably the ones produced from that tag by the
# pipeline in that tag's own tree.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      # Fail cheap before allocating the six native packaging runners. The final publish step
      # repeats the release-exists check to close the race while the candidate is building.
      - name: Refuse to publish from anything but a tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "publish.yml must be dispatched at a tag; got $GITHUB_REF_TYPE $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi

      - name: Verify release metadata agrees
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const manifest = require('./extension/manifest.json');
          const versionSource = fs.readFileSync('src/main/version.ts', 'utf8');
          const appVersion = versionSource.match(/APP_VERSION = '([^']+)'/)?.[1];
          const versions = [pkg.version, lock.version, lock.packages?.['']?.version, manifest.version, appVersion];
          if (versions.some((version) => version !== pkg.version)) {
            throw new Error(`Release versions disagree: ${versions.join(', ')}`);
          }

          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const changelogVersion = changelog.match(/^## \[(\d+\.\d+\.\d+)\]/m)?.[1];
          if (changelogVersion !== pkg.version) {
            throw new Error(`Top changelog entry ${changelogVersion ?? '<missing>'} does not match ${pkg.version}`);
          }

          const notesPath = `docs/release-notes/v${pkg.version}.md`;
          if (!fs.existsSync(notesPath)) throw new Error(`Missing ${notesPath}`);
          const notes = fs.readFileSync(notesPath, 'utf8');
          if (!notes.includes(`## ${pkg.version}`)) throw new Error(`${notesPath} has no matching version heading`);
          if (!/unsigned/i.test(notes) || !/unnotarized/i.test(notes)) {
            throw new Error(`${notesPath} must disclose unsigned and unnotarized macOS artifacts`);
          }
          for (const artifact of [
            'ParadigmEve-Setup-x64-debug.exe',
            'ParadigmEve-Setup-arm64-debug.exe',
            'ParadigmEve-macOS-x64-debug.dmg',
            'ParadigmEve-macOS-arm64-debug.dmg',
            'ParadigmEve-Linux-x64-debug.AppImage',
            'ParadigmEve-Linux-x64-debug.deb',
            'ParadigmEve-Linux-arm64-debug.AppImage',
            'ParadigmEve-Linux-arm64-debug.deb',
            'ParadigmEve-Extension.zip',
            'ParadigmEve-Native-Sources.tar.gz',
            'SHA256SUMS.txt'
          ]) {
            if (!notes.includes(`\`${artifact}\``)) throw new Error(`${notesPath} is missing ${artifact}`);
          }
          NODE

      # A release remains reproducible because the tunnel bytes are version/checksum pinned.
      # Refuse a stale pin instead of silently changing the payload named by this tag.
      - name: Require current OpenAI tunnel-client
        run: npm run verify:tunnel-current

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      - name: Require reviewed release notes for this tag
        run: |
          set -euo pipefail
          notes="docs/release-notes/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "Missing $notes — write the release notes and tag again." >&2
            exit 1
          fi

      - name: Refuse an existing release
        run: node scripts/check-release-absent.mjs

  candidate:
    name: Build candidate
    needs: preflight
    uses: ./.github/workflows/release.yml

  publish:
    name: Publish
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      # A branch has no version guarantee — release.yml only checks the tag against
      # package.json when the ref is a tag — so a branch must never reach `gh release create`.
      - name: Refuse to publish from anything but a tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "publish.yml must be dispatched at a tag; got $GITHUB_REF_TYPE $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify public-history privacy
        run: node scripts/verify-public-history.mjs

      # Release notes are written by hand and reviewed in the tagged tree. Generating
      # them here would mean the release said something nobody read before it shipped.
      - name: Require reviewed release notes for this tag
        run: |
          set -euo pipefail
          notes="docs/release-notes/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "Missing $notes — write the release notes and tag again." >&2
            exit 1
          fi

      - name: Download the candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: paradigmeve-candidate-${{ github.run_id }}
          path: publish

      # The checksums were computed on the packaging runner. Re-checking them here proves
      # the bytes about to be attached are the bytes that were smoke-tested.
      - name: Re-verify the checksums
        working-directory: publish
        run: |
          set -euo pipefail
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      # The macOS ZIPs are built and checked above for CI coverage but are not release assets
      # (the DMG is the public macOS download). Publish checksums only for files actually attached.
      - name: Keep CI-only archives out of the public checksums
        working-directory: publish
        run: |
          set -euo pipefail
          grep -v -E '  ParadigmEve-macOS-(x64|arm64)-debug\.zip$' SHA256SUMS.txt > SHA256SUMS.public.txt
          mv SHA256SUMS.public.txt SHA256SUMS.txt
          if grep -q -E 'ParadigmEve-macOS-.*\.zip' SHA256SUMS.txt; then
            echo "CI-only macOS ZIP still listed in the public checksums" >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        run: |
          set -euo pipefail
          # Repeat after the native candidate build so a new upstream release published while
          # the six runners were working cannot leave this release stale.
          npm run verify:tunnel-current
          node scripts/check-release-absent.mjs
          gh release create "$TAG" \
            publish/ParadigmEve-Setup-x64-debug.exe \
            publish/ParadigmEve-Setup-arm64-debug.exe \
            publish/ParadigmEve-macOS-x64-debug.dmg \
            publish/ParadigmEve-macOS-arm64-debug.dmg \
            publish/ParadigmEve-Linux-x64-debug.AppImage \
            publish/ParadigmEve-Linux-x64-debug.deb \
            publish/ParadigmEve-Linux-arm64-debug.AppImage \
            publish/ParadigmEve-Linux-arm64-debug.deb \
            publish/ParadigmEve-Extension.zip \
            publish/ParadigmEve-Native-Sources.tar.gz \
            publish/SHA256SUMS.txt \
            --title "$(sed -n 's/^## //p' "docs/release-notes/$TAG.md" | head -n 1)" \
            --notes-file "docs/release-notes/$TAG.md" \
            --prerelease
          gh release view "$TAG" --json url --jq .url
